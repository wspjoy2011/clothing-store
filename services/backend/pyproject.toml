[project]
name = "front-back-docker"
version = "0.1.0"
description = ""
authors = [
    {name = "Yurii Okal",email = "wspjoy2011@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "fastapi>=0.115.12,<0.116.0",
    "pydantic-settings>=2.9.1,<3.0.0",
    "numpy==1.26.4",
    "psycopg[binary]>=3.1.9",
    "psycopg-pool>=3.2.6,<4.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "async-lru>=2.0.5,<3.0.0",
    "uvicorn>=0.34.2,<0.35.0",
    "elasticsearch[async]>=9.0.1,<10.0.0",
    "passlib[argon2]>=1.7.4,<2.0.0",
    "bcrypt>=4.3.0,<5.0.0",
    "validators>=0.35.0,<0.36.0",
    "email-validator>=2.2.0,<3.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "aiosmtplib>=4.0.1,<5.0.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "authlib>=1.6.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.1,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
    "mlxtend>=0.23.4,<0.24.0",
    "networkx>=3.4.2,<4.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
omit = [
    "src/etl/*",
    "src/notifications/email/templates/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
